<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>claudsmm Page</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            -webkit-tap-highlight-color: transparent; /* إزالة الوميض الأزرق عند الضغط في الهواتف */
            padding-bottom: 90px; /* مساحة في الأسفل لتفادي تداخل المحتوى مع الشريط السفلي */
            background-color: #FBFAFA;
        }
        .header {
            background-color: #FBFAFA;
            padding: 16px 24px;
            font-size: 20px;
            font-weight: bold;
            color: #333;
            display: flex;
            align-items: center;
            border-bottom: 1px solid rgba(0, 0, 0, 0.03);
            position: relative;
            z-index: 1001;
        }
        .content {
            background-color: #FBFAFA;
            min-height: 100vh;
            padding: 24px 20px;
            box-sizing: border-box;
            max-width: 480px;
            margin: 0 auto;
        }
        /* تنسيق أيقونة الموقع */
        .header-logo {
            width: 32px;
            height: 32px;
            margin-right: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .cloud-segment {
            fill: none;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .color-yellow { stroke: #FFC107; }
        .color-orange { stroke: #FF9800; }
        .color-red { stroke: #F44336; }
        .gemini-star { fill: #F44336; }

        /* تنسيق قسم الرصيد والأيقونات تحت الهيدر */
        .page-balance-section {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            font-family: 'Inter', sans-serif;
            margin-bottom: 24px;
        }
        .balance-right-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .balance-badge {
            background-color: #F1F3F4;
            color: #1A1C19;
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(0, 0, 0, 0.04);
        }
        .circle-btn {
            background-color: #F1F3F4;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 1px solid rgba(0, 0, 0, 0.04);
            padding: 0;
            transition: background-color 0.2s, transform 0.1s;
        }
        .circle-btn:active {
            transform: scale(0.95);
            background-color: #E2E5E7;
        }
        .circle-btn svg {
            width: 18px;
            height: 18px;
            fill: #1A1C19;
        }
        .circle-btn .eye-hidden {
            display: none;
        }

        /* تنسيق قسم الرصيد الإجمالي */
        .total-balance-box {
            font-family: 'Inter', sans-serif;
            margin-top: 25px;
            color: #5F6368;
        }
        .total-balance-label {
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #70757a;
        }
        .total-balance-amount {
            font-size: 36px;
            font-weight: 700;
            letter-spacing: -1px;
            color: #1A1C19;
        }

        /* تنسيق أزرار الخيارات الدائرية الأربعة الحديثة */
        .balance-options-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 24px;
            margin-top: 28px;
            font-family: 'Inter', sans-serif;
            width: 100%;
        }
        .option-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            flex: 1;
            max-width: 110px;
            cursor: pointer;
            user-select: none;
            text-decoration: none;
        }
        .option-circle-btn {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background-color: #F1F3F4;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            padding: 0;
            transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.03);
            cursor: pointer;
        }
        .option-item:hover .option-circle-btn {
            background-color: #E8EAED;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.06);
        }
        .option-item:active .option-circle-btn {
            transform: scale(0.92);
            background-color: #E2E5E7;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
        }
        .option-circle-btn.btn-deposit-primary {
            background-color: #F44336;
            box-shadow: 0 6px 16px rgba(244, 67, 54, 0.25);
        }
        .option-item:hover .option-circle-btn.btn-deposit-primary {
            background-color: #E53935;
            box-shadow: 0 8px 20px rgba(244, 67, 54, 0.35);
        }
        .option-item:active .option-circle-btn.btn-deposit-primary {
            transform: scale(0.92);
            background-color: #D32F2F;
            box-shadow: 0 3px 8px rgba(244, 67, 54, 0.2);
        }
        .option-circle-btn svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: #1A1C19;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .option-circle-btn.btn-deposit-primary svg {
            stroke: #FFFFFF;
        }
        .option-label {
            font-size: 13px;
            font-weight: 600;
            color: #1A1C19;
            text-align: center;
        }

        /* تنسيق بطاقة الحساب الجديدة */
        .account-card-container {
            margin-top: 32px;
            background-color: #FFFFFF;
            border-radius: 28px;
            padding: 0 0 24px 0;
            font-family: 'Inter', sans-serif;
            width: 100%;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(0, 0, 0, 0.03);
        }
        .card-top-banner {
            background-color: #D4E3EA;
            padding: 18px 20px 24px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom-left-radius: 28px;
            border-bottom-right-radius: 28px;
            position: relative;
        }
        .cards-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #142300;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: opacity 0.2s;
        }
        .cards-link:active {
            opacity: 0.7;
        }
        .card-top-logo {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .account-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 24px 20px 0 20px;
            text-decoration: none;
        }
        .account-main-title {
            font-size: 22px;
            font-weight: 700;
            color: #191C17;
            margin: 0;
        }
        .account-main-balance {
            font-size: 16px;
            color: #43483F;
            margin-top: 4px;
            padding: 0 20px;
        }
        .currency-list {
            margin-top: 16px;
            display: flex;
            flex-direction: column;
        }
        .currency-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px;
            cursor: pointer;
            transition: background-color 0.2s;
            border-radius: 16px;
            margin: 0 8px;
            text-decoration: none;
        }
        .currency-item:hover {
            background-color: #F8F9FA;
        }
        .currency-item:active {
            background-color: #E8EAED;
        }
        .currency-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .flag-icon-container {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: #F1F3F4;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }
        .flag-icon-container svg {
            width: 20px;
            height: 20px;
            fill: #1A1C19;
        }
        .currency-amount {
            font-size: 16px;
            font-weight: 600;
            color: #191C17;
        }
        .arrow-icon {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: #43483F;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* تنسيق الشريط السفلي المتجاوب مع الهواتف والحواسب */
        .bottom-nav {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 32px);
            max-width: 440px;
            background-color: rgba(220, 222, 225, 0.45);
            backdrop-filter: blur(20px) saturate(160%);
            -webkit-backdrop-filter: blur(20px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 40px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.06), inset 0 1px 2px rgba(255, 255, 255, 0.2);
            font-family: 'Inter', sans-serif;
            box-sizing: border-box;
            z-index: 1000;
            transition: all 0.3s ease;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            color: #5F6368;
            font-size: 11.5px;
            font-weight: 500;
            padding: 10px 0;
            border-radius: 32px;
            gap: 5px;
            transition: background-color 0.25s ease, color 0.25s ease, transform 0.15s ease, border-color 0.25s ease, box-shadow 0.25s ease;
            border: 1px solid transparent;
            cursor: pointer;
            user-select: none;
        }
        .nav-item svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: #5F6368;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.25s ease, stroke-width 0.25s ease;
        }
        .nav-item:active {
            transform: scale(0.92);
            background-color: rgba(0, 0, 0, 0.04);
        }
        .nav-item.active {
            background-color: rgba(255, 255, 255, 0.7);
            color: #1A1C19;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.03);
        }
        .nav-item.active svg {
            stroke: #1A1C19;
            stroke-width: 2.2;
        }

        /* تعديل التصميم ليصبح شريطاً جانبياً عمودياً ممتداً في الحواسب وشاشات العرض الكبيرة */
        @media (min-width: 769px) {
            body {
                padding-bottom: 0;
                padding-left: 140px; /* إضافة مساحة على اليسار لمنع تداخل المحتوى مع الشريط الجانبي */
            }
            .bottom-nav {
                top: 0;
                left: 0;
                bottom: 0;
                transform: none;
                width: 100px;
                height: 100vh;
                max-height: none;
                flex-direction: column;
                justify-content: flex-start;
                gap: 24px;
                padding: 40px 8px;
                border-radius: 0;
                border: none;
                border-right: 1px solid rgba(0, 0, 0, 0.05);
                background-color: rgba(220, 222, 225, 0.5);
            }
            .nav-item {
                flex: none;
                width: 100%;
                padding: 14px 0;
            }
            /* تعديل ترتيب العناصر في الشريط الجانبي ليصبح Support في النهاية تماماً */
            .nav-item.nav-support-item {
                margin-top: auto;
            }
            /* تعديل شكل قسم Quick Access وباقي العناصر لتناسب شاشات الحاسوب الكبيرة */
            .content {
                max-width: 800px;
                padding: 40px;
            }
            .account-card-container {
                border-radius: 24px;
            }
            .currency-list {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 12px;
                padding: 16px;
            }
            .currency-item {
                margin: 0;
                border: 1px solid rgba(0, 0, 0, 0.04);
                background-color: #FAFBFB;
            }
        }

        /* حاوية لاستدعاء الصفحات الخارجية بشكل سلس داخل المحتوى */
        .iframe-container {
            width: 100%;
            height: calc(100vh - 70px);
            border: none;
            display: none;
        }
    </style>
</head>

    <script>
        let isHidden = false;
        function toggleBalance() {
            const balanceText = document.getElementById('balance-text');
            const totalBalanceAmount = document.getElementById('total-balance-amount');
            const eyeVisible = document.querySelector('.eye-visible');
            const eyeHidden = document.querySelector('.eye-hidden');
            
            isHidden = !isHidden;
            
            if (isHidden) {
                balanceText.textContent = '•••••';
                totalBalanceAmount.textContent = '•••••';
                eyeVisible.style.display = 'none';
                eyeHidden.style.display = 'block';
            } else {
                balanceText.textContent = '$0.00';
                totalBalanceAmount.textContent = '0.00 USD';
                eyeVisible.style.display = 'block';
                eyeHidden.style.display = 'none';
            }
        }

        function handleNavClick(element, event) {
            if (event) event.preventDefault();
            
            // عند الضغط على أزرار القائمة السفلية، نعود للصفحة الرئيسية ونخفي الـ iframe
            document.getElementById('page-loader').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';

            const navItems = document.querySelectorAll('.nav-item');
            navItems.forEach(item => {
                item.classList.remove('active');
                const svgPaths = item.querySelectorAll('svg path');
                svgPaths.forEach(path => {
                    if(path.getAttribute('style')) {
                        path.style.stroke = '#5F6368';
                        path.style.strokeWidth = '2';
                    }
                });
            });
            element.classList.add('active');
            
            const activeSvgPaths = element.querySelectorAll('svg path');
            activeSvgPaths.forEach(path => {
                if(path.getAttribute('style')) {
                    path.style.stroke = '#1A1C19';
                    path.style.strokeWidth = '2.2';
                }
            });
        }

        function handleButtonClick(element) {
            // تأثير الضغط الاحترافي السريع والرجوع للوضع الطبيعي تلقائيًا لتستعمل دائماً بدون تعليق
            element.style.transform = 'scale(0.95)';
            element.style.opacity = '0.7';
            setTimeout(() => {
                element.style.transform = 'none';
                element.style.opacity = '1';
            }, 120);
        }

        // وظيفة جلب وعرض الصفحة الخارجية المطلوبة تحت الهيدر وفوق شريط التنقل السفلي
        function loadExternalPage(url, element) {
            handleButtonClick(element);
            
            const mainContent = document.getElementById('main-content');
            const pageLoader = document.getElementById('page-loader');
            
            mainContent.style.display = 'none';
            pageLoader.src = url;
            pageLoader.style.display = 'block';
        }
    </script>
