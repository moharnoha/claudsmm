<!DOCTYPE html>
<html lang="en" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>claudsmm</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: #1F1E1E;
            color: #1e293b;
            text-align: center;
        }

        /* --- Header Section --- */
        header {
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            background-color: #FFFFFF; 
            border-bottom: 1px solid #e2e8f0;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
            direction: ltr !important; 
            box-sizing: border-box;
            width: 100%;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-shrink: 0;
        }

        .menu-icon {
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 8px;
            flex-shrink: 0;
        }

        .menu-icon span {
            width: 18px;
            height: 2px;
            background-color: #5F6368;
            border-radius: 2px;
        }

        .logo-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .logo-svg {
            width: 32px;
            height: 32px;
            flex-shrink: 0;
        }

        .logo-text {
            font-size: 1.35rem;
            font-weight: 500;
            letter-spacing: -0.5px;
            color: #5F6368;
            text-transform: none;
            white-space: nowrap;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 24px;
            flex-direction: row; 
            flex-shrink: 0;
            margin-left: auto;
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: transparent;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            order: 4; 
            overflow: hidden;
            flex-shrink: 0;
        }

        .user-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .nav-link {
            color: #1a73e8;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
        }

        .lang-dropdown {
            position: relative;
            display: inline-block;
            flex-shrink: 0;
            order: -1;
        }

        .lang-switch {
            display: flex;
            align-items: center;
            gap: 4px;
            background: none;
            border: none;
            color: #5F6368;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            white-space: nowrap;
        }

        .lang-switch:hover {
            background-color: #f1f3f4;
        }

        .lang-switch svg {
            width: 16px;
            height: 16px;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            background-color: #ffffff;
            min-width: 120px;
            box-shadow: 0px 8px 166px 0px rgba(0,0,0,0.1);
            z-index: 100;
            border-radius: 8px;
            margin-top: 4px;
            border: 1px solid #e2e8f0;
        }

        .dropdown-content.show {
            display: block;
        }

        .dropdown-content div {
            color: #3c4043;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            font-size: 0.9rem;
            cursor: pointer;
            text-align: left;
        }

        .dropdown-content div:hover {
            background-color: #f8f9fa;
        }

        /* --- Welcome Section --- */
        .hero {
            padding: 112px 24px 0 24px;
            background-color: #1F1E1E;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .promo-box {
            background-color: #202124; 
            border: 1px solid #3c4043; 
            border-radius: 28px; 
            padding: 24px 40px;
            margin: 0 auto 64px auto;
            width: 100%;
            max-width: 900px;
            direction: ltr; 
            text-align: left;
            display: flex;
            flex-direction: row; 
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            box-sizing: border-box;
        }

        .promo-content {
            flex: 1;
            text-align: left;
        }

        .promo-title {
            color: #FFFFFF;
            font-size: 1.4rem;
            font-weight: 500;
            margin-bottom: 8px;
            line-height: 1.2;
        }

        .promo-desc {
            color: #bdc1c6;
            font-size: 0.9rem;
            line-height: 1.5;
            margin-bottom: 0;
        }

        .promo-btn {
            background-color: #f68b1e; 
            color: #000000;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            white-space: nowrap;
        }

        /* Title with Animated Logo Styling */
        #here_title {
            color: white;
            font-size: 4.5rem; 
            font-weight: 700;
            margin: 0 auto 24px auto;
            line-height: 1.1; 
            max-width: 1000px;
            text-align: center;
            letter-spacing: -1px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .inline-logo-container {
            width: 80px;
            height: 80px;
            position: relative;
            display: inline-flex;
            vertical-align: middle;
        }

        .cloud-segment {
            fill: none;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 100;
            stroke-dashoffset: 100;
            animation: assemble 3.5s ease-in-out infinite;
        }

        .color-yellow { stroke: #FFC107; animation-delay: 0.2s; }
        .color-orange { stroke: #FF9800; animation-delay: 0.4s; }
        .color-red { stroke: #F44336; animation-delay: 0.6s; }

        .gemini-star {
            fill: #F44336;
            opacity: 0;
            transform-origin: center;
            animation: star-appear 3.5s ease-in-out infinite 0.8s;
        }

        @keyframes assemble {
            0% { stroke-dashoffset: 100; opacity: 0; transform: scale(0.5) rotate(-15deg); }
            30% { stroke-dashoffset: 0; opacity: 1; transform: scale(1) rotate(0deg); }
            70% { opacity: 1; transform: scale(1); }
            80% { opacity: 0; transform: scale(1.2); }
            100% { opacity: 0; transform: scale(1.2); }
        }

        @keyframes star-appear {
            0% { opacity: 0; transform: scale(0); }
            30% { opacity: 1; transform: scale(1); }
            70% { opacity: 1; transform: scale(1); }
            80% { opacity: 0; transform: scale(1.5); }
            100% { opacity: 0; transform: scale(1.5); }
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
        }

        @keyframes sand-explosion {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
        }

        #here_subtitle {
            display: none; 
        }

        @media (max-width: 768px) {
            header { padding: 0 16px; height: 56px; }
            .hero { padding-top: 104px; }
            .header-right { gap: 12px; }
            .nav-link { display: none; }
            .promo-box {
                flex-direction: column;
                text-align: center;
                padding: 32px 24px;
                border-radius: 24px;
            }
            .promo-content { text-align: center; }
            #here_title { font-size: 2.5rem; }
            .inline-logo-container { width: 50px; height: 50px; }
        }

        /* --- Login Section --- */
        .bottom-sheet {
            position: relative;
            background-color: #FFFFFF;
            padding: 64px 0 0 0; 
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .sheet-scroll-content {
            width: 100%;
            max-width: 440px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 24px; 
            box-sizing: border-box;
        }

        .sheet-logo-group {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .sheet-logo-svg {
            width: 44px;
            height: 44px;
        }

        .sheet-logo-text {
            font-size: 2rem;
            font-weight: 600;
            color: #202124;
            letter-spacing: -0.5px;
        }

        .sheet-tagline {
            font-size: 1.1rem;
            font-weight: 400;
            color: #5f6368;
            margin-bottom: 40px;
        }

        .auth-buttons {
            display: flex;
            flex-direction: column; 
            gap: 12px;
            width: 100%;
            margin-bottom: 32px;
        }

        .icon-btn {
            width: 100%;
            height: 48px;
            border-radius: 8px; 
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: none;
            font-size: 0.95rem;
        }

        .more-options {
            color: #70757a;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            width: 100%;
            margin-bottom: 24px;
        }
        
        .more-options::before, .more-options::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #dadce0;
            margin: 0 16px;
        }

        .terms-text {
            color: #70757a;
            font-size: 0.75rem;
            margin-bottom: 48px;
            line-height: 1.6;
        }

        .login-footer {
            width: 100%;
            background-color: #f8f9fa;
            padding: 32px 0;
            color: #5f6368;
            font-size: 0.9rem;
            border-top: 1px solid #dadce0;
        }

        .login-footer span {
            color: #1a73e8;
            font-weight: 500;
            cursor: pointer;
            margin-left: 4px;
        }
    </style>
</head>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, setPersistence, browserLocalPersistence, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB98ZcMGXH5z20p7H9T-PXyM_29Xb0KN54",
            authDomain: "claudsmm.com",
            projectId: "claudsmm-1bf0e",
            storageBucket: "claudsmm-1bf0e.firebasestorage.app",
            messagingSenderId: "1028854156095",
            appId: "1:1028854156095:web:a501ebb98679f82a40218a"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let currentLang = "en";

        const langBtn = document.getElementById('langBtn');
        const langDropdown = document.getElementById('langDropdown');
        const avatarDiv = document.getElementById('userAvatar');

        langBtn.onclick = (e) => {
            e.stopPropagation();
            langDropdown.classList.toggle('show');
        };

        window.onclick = () => {
            if (langDropdown.classList.contains('show')) {
                langDropdown.classList.remove('show');
            }
        };

        window.selectLanguage = function(lang) {
            currentLang = lang;
            document.getElementById('currentLangText').innerText = lang === 'ar' ? 'العربية' : 'English';
            
            // Update UI for original English preference
            const options = langDropdown.querySelectorAll('div');
            options.forEach(opt => {
                opt.style.textDecoration = 'none';
                opt.style.opacity = '1';
            });
            const selectedOpt = lang === 'en' ? options[0] : options[1];
            selectedOpt.style.textDecoration = 'underline';
            selectedOpt.style.opacity = '0.8';

            langDropdown.classList.remove('show');
            loadTexts();
        };

        async function loadTexts() {
            try {
                const docRef = doc(db, "app_data", currentLang);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    document.querySelectorAll('.logo-text, .sheet-logo-text').forEach(el => {
                        el.innerText = data.logo_name || "";
                    });
                    
                    const fullTitle = data.here_title || "";
                    const words = fullTitle.split(' ');
                    if (words.length > 0) {
                        document.getElementById('title_first_word').innerText = words[0];
                        document.getElementById('title_rest').innerText = words.slice(1).join(' ');
                    }

                    document.getElementById('promo_title').innerText = data.promo_title || "";
                    document.getElementById('promo_description').innerText = data.promo_description || "";
                    document.getElementById('promo_button_text').innerText = data.promo_button_text || "";
                    document.querySelector('.sheet-tagline').innerText = data.tagline || "";
                    document.querySelector('.more-options').innerText = data.more_options || "";
                    document.querySelector('.terms-text').innerHTML = data.terms_text || "";
                    
                    const consoleLink = document.getElementById('console-link');
                    const blogLink = document.getElementById('blog-link');
                    if(currentLang === 'ar') {
                        consoleLink.innerText = "انتقل إلى وحدة التحكم";
                        blogLink.innerText = "مدونة";
                    } else {
                        consoleLink.innerText = "Go to console";
                        blogLink.innerText = "Blog";
                    }

                    const footer = document.querySelector('.login-footer');
                    if (footer && data.footer_text) {
                        footer.innerHTML = `${data.footer_text} <span>${data.login_link || ""}</span>`;
                    }
                }
            } catch (error) {
                console.error("Error loading texts:", error);
            }
        }

        // Particle explosion logic
        function createExplosion() {
            const container = document.getElementById('inline-logo');
            if (!container) return;
            const colors = ['#FFC107', '#FF9800', '#F44336'];
            
            for (let i = 0; i < 40; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                p.style.left = '50%';
                p.style.top = '50%';
                
                const angle = Math.random() * Math.PI * 2;
                const velocity = 20 + Math.random() * 60;
                const tx = Math.cos(angle) * velocity + 'px';
                const ty = Math.sin(angle) * velocity + 'px';
                
                p.style.setProperty('--tx', tx);
                p.style.setProperty('--ty', ty);
                p.style.animation = `sand-explosion ${0.6 + Math.random() * 0.4}s ease-out forwards`;
                
                container.appendChild(p);
                setTimeout(() => p.remove(), 1000);
            }
        }

        setInterval(createExplosion, 3500);

        const handleSignIn = async () => {
            try {
                const result = await signInWithPopup(auth, provider);
                if (result.user) window.location.href = "Dashboard/";
            } catch (error) {
                console.error("Auth Error:", error.code);
            }
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                avatarDiv.style.display = 'flex';
                if (user.photoURL) {
                    avatarDiv.innerHTML = `<img src="${user.photoURL}" alt="${user.email}" title="${user.email}">`;
                } else {
                    const initial = user.email ? user.email.charAt(0).toUpperCase() : '?';
                    avatarDiv.innerHTML = `<span title="${user.email}" style="font-weight: 600; color: #5F6368; font-size: 0.9rem;">${initial}</span>`;
                }
                avatarDiv.onclick = () => window.location.href = "Dashboard/";
            } else {
                avatarDiv.style.display = 'none';
                avatarDiv.innerHTML = '';
            }
        });

        loadTexts();
        setPersistence(auth, browserLocalPersistence);
        document.getElementById('googleSignInBtn').onclick = handleSignIn;
        avatarDiv.onclick = handleSignIn;
    </script>
</body>
</html>
